<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>

<body>

    <video src="video.mp4" width="555" controls loop autoplay></video>
    <!-- Controls used for Playing and Pausing the Video, loop used for looping the video, autoplay used for automatically playing the video. width is for the width of the video player. -->

    <audio src="audio.mp3" controls loop autoplay></audio>

    <img src="img.svg" alt="My svg Image">
    <!-- alt attribute provides alternative text for the image -->

    <iframe width="560" height="315" src="https://www.youtube.com/embed/YBB3GbluHjA?si=n8mzcEJ5PMtyRvVD"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <!-- iframe is used to embed a YouTube video -->

</body>

</html>
